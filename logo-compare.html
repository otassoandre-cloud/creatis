<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Logo Créatis — Comparaison</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050505; color:#fff; font-family:system-ui,sans-serif; padding:40px; text-align:center; }
h1 { font-size:18px; color:#888; margin-bottom:30px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:800px; margin:0 auto; }
.card { background:#0a0a0a; border:1px solid #222; border-radius:16px; padding:20px; }
.card img { width:100%; border-radius:12px; }
.card .label { margin-top:12px; font-size:14px; font-weight:700; color:#10b981; }
</style>
</head>
<body>
<h1>Choisis ton logo — clique pour voir en grand</h1>
<div class="grid">
  <div class="card"><a href="/images/logo-v1.png" target="_blank"><img src="/images/logo-v1.png" alt="Logo V1"></a><div class="label">Version 1</div></div>
  <div class="card"><a href="/images/logo-v2.png" target="_blank"><img src="/images/logo-v2.png" alt="Logo V2"></a><div class="label">Version 2</div></div>
  <div class="card"><a href="/images/logo-v3.png" target="_blank"><img src="/images/logo-v3.png" alt="Logo V3"></a><div class="label">Version 3</div></div>
  <div class="card"><a href="/images/logo-v4.png" target="_blank"><img src="/images/logo-v4.png" alt="Logo V4"></a><div class="label">Version 4</div></div>
</div>
</body>
</html>
