<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créatis — Chat Lab ⚗</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f0d;
      --bg2: #0f1612;
      --bg3: #141d19;
      --vert: #3ecf6e;
      --vert-dim: rgba(62,207,110,0.12);
      --vert-glow: rgba(62,207,110,0.06);
      --bordure: rgba(255,255,255,0.07);
      --texte: #f0faf4;
      --texte-muted: #6b8f7a;
      --radius: 14px;
      --transition: 0.18s ease;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--texte);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Lab banner ── */
    .lab-banner {
      background: linear-gradient(90deg, rgba(62,207,110,0.15), rgba(62,207,110,0.06));
      border-bottom: 1px solid rgba(62,207,110,0.2);
      padding: 7px 20px;
      font-size: 12px;
      color: var(--vert);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── Header ── */
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 56px;
      border-bottom: 1px solid var(--bordure);
      flex-shrink: 0;
      gap: 12px;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }
    .logo span { color: var(--vert); }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .plan-badge {
      font-size: 11px;
      font-weight: 600;
      background: var(--vert-dim);
      color: var(--vert);
      border: 1px solid rgba(62,207,110,0.25);
      border-radius: 20px;
      padding: 3px 10px;
      letter-spacing: 0.04em;
    }
    .clear-btn {
      background: none;
      border: 1px solid var(--bordure);
      color: var(--texte-muted);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }
    .clear-btn:hover { border-color: var(--vert); color: var(--vert); }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 8px;
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .messages-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px 20px 20px;
      text-align: center;
    }
    .empty-sphere-wrap {
      width: 120px;
      height: 120px;
      position: relative;
    }
    .empty-sphere-wrap canvas { display: block; }
    .empty-title {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }
    .empty-sub {
      font-size: 14px;
      color: var(--texte-muted);
      max-width: 320px;
      line-height: 1.5;
    }
    .quick-agents {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 4px;
    }
    .quick-agent-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      background: var(--bg2);
      border: 1px solid var(--bordure);
      border-radius: 24px;
      color: var(--texte-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }
    .quick-agent-btn:hover {
      border-color: var(--vert);
      color: var(--texte);
      background: var(--vert-glow);
    }
    .quick-agent-btn .q-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.6;
    }

    /* ── Message types ── */
    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Form card (agent input) */
    .msg-form-card {
      background: var(--bg2);
      border: 1px solid var(--bordure);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }
    .msg-form-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--agent-color, var(--vert));
      border-radius: 3px 0 0 3px;
    }
    .form-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px 20px;
      border-bottom: 1px solid var(--bordure);
    }
    .form-card-icon {
      width: 34px; height: 34px;
      background: var(--vert-dim);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--vert);
      flex-shrink: 0;
    }
    .form-card-info { flex: 1; min-width: 0; }
    .form-card-nom {
      font-weight: 600;
      font-size: 14px;
      color: var(--texte);
    }
    .form-card-desc {
      font-size: 12px;
      color: var(--texte-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .form-card-close {
      background: none;
      border: none;
      color: var(--texte-muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: var(--transition);
      line-height: 1;
    }
    .form-card-close:hover { color: var(--texte); background: rgba(255,255,255,0.05); }

    .form-card-body {
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-row { display: flex; flex-direction: column; gap: 5px; }
    .form-row label { font-size: 12px; font-weight: 600; color: var(--texte-muted); letter-spacing: 0.03em; }
    .form-row input,
    .form-row select,
    .form-row textarea {
      background: var(--bg3);
      border: 1px solid var(--bordure);
      border-radius: 8px;
      color: var(--texte);
      font-family: inherit;
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      transition: var(--transition);
      width: 100%;
    }
    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus { border-color: rgba(62,207,110,0.4); background: #0d1a15; }
    .form-row textarea { resize: vertical; min-height: 80px; }
    .form-row select option { background: #1a2820; }

    .form-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .btn-generer {
      flex: 1;
      background: var(--vert);
      color: #000;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-generer:hover { background: #4fe880; }
    .btn-generer:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-generer .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* User summary message */
    .msg-user {
      align-self: flex-end;
      background: var(--vert-dim);
      border: 1px solid rgba(62,207,110,0.2);
      border-radius: 14px 14px 4px 14px;
      padding: 10px 16px;
      font-size: 14px;
      color: var(--texte);
      max-width: 80%;
    }
    .msg-user-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--vert);
      margin-bottom: 3px;
      letter-spacing: 0.03em;
    }

    /* AI response message */
    .msg-ai {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .msg-ai-avatar {
      width: 30px; height: 30px;
      background: var(--vert-dim);
      border: 1px solid rgba(62,207,110,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-ai-avatar svg { width: 14px; height: 14px; color: var(--vert); }
    .msg-ai-bubble {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--bordure);
      border-radius: 4px 14px 14px 14px;
      padding: 14px 18px;
      font-size: 14px;
      line-height: 1.65;
      color: var(--texte);
      min-width: 0;
    }
    .msg-ai-bubble.loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--texte-muted);
      font-style: italic;
    }
    .dots-anim span {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--vert);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dots-anim span:nth-child(2) { animation-delay: 0.2s; }
    .dots-anim span:nth-child(3) { animation-delay: 0.4s; }

    /* AI response content */
    .ai-content h2 { font-family: 'Syne', sans-serif; font-size: 16px; color: var(--vert); margin: 18px 0 8px; font-weight: 700; }
    .ai-content h3 { font-size: 14px; color: #fff; margin: 14px 0 6px; font-weight: 600; }
    .ai-content p { margin: 6px 0; color: #c8ddd2; }
    .ai-content ul, .ai-content ol { padding-left: 20px; margin: 6px 0; }
    .ai-content li { margin: 3px 0; color: #c8ddd2; }
    .ai-content strong { color: #fff; font-weight: 600; }
    .ai-content em { color: var(--vert); font-style: normal; }
    .ai-content code { background: rgba(62,207,110,0.1); border-radius: 4px; padding: 1px 6px; font-family: monospace; font-size: 13px; color: var(--vert); }
    .ai-content pre { background: var(--bg3); border: 1px solid var(--bordure); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; }
    .ai-content pre code { background: none; padding: 0; }
    .ai-content hr { border: none; border-top: 1px solid var(--bordure); margin: 14px 0; }

    .msg-ai-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-action {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: 1px solid var(--bordure);
      color: var(--texte-muted);
      font-family: inherit;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-action:hover { border-color: var(--vert); color: var(--vert); }

    /* Image result */
    .ai-image-result img {
      width: 100%;
      max-width: 500px;
      border-radius: 10px;
      border: 1px solid var(--bordure);
      display: block;
      margin-top: 4px;
    }

    /* ── Bottom bar ── */
    .chat-bottom {
      border-top: 1px solid var(--bordure);
      padding: 12px 16px 16px;
      flex-shrink: 0;
      background: var(--bg);
    }
    .input-row {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    .plus-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: 1px solid var(--bordure);
      background: var(--bg2);
      color: var(--texte-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      flex-shrink: 0;
      font-size: 22px;
      font-weight: 300;
      padding-bottom: 2px;
    }
    .plus-btn:hover, .plus-btn.active {
      border-color: var(--vert);
      color: var(--vert);
      background: var(--vert-glow);
    }
    .chat-input-wrap {
      flex: 1;
      position: relative;
    }
    .chat-input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--bordure);
      border-radius: 12px;
      color: var(--texte);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 44px 10px 14px;
      outline: none;
      transition: var(--transition);
      resize: none;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
    }
    .chat-input:focus { border-color: rgba(62,207,110,0.35); }
    .chat-input::placeholder { color: var(--texte-muted); }
    .send-btn {
      position: absolute;
      right: 8px;
      bottom: 7px;
      width: 30px; height: 30px;
      background: var(--vert);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .send-btn:hover { background: #4fe880; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { width: 14px; height: 14px; color: #000; }
    .input-hint {
      font-size: 11px;
      color: var(--texte-muted);
      text-align: center;
      margin-top: 8px;
      letter-spacing: 0.02em;
    }

    /* ── Agent picker ── */
    .picker-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
    }
    .picker-overlay.open { display: flex; align-items: flex-end; justify-content: center; }
    .picker-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
    }
    .picker-panel {
      position: relative;
      z-index: 1;
      background: #0d1812;
      border: 1px solid rgba(62,207,110,0.15);
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 760px;
      padding: 20px 20px 24px;
      animation: slideUp 0.22s ease;
    }
    .picker-handle {
      width: 36px; height: 4px;
      background: var(--bordure);
      border-radius: 2px;
      margin: 0 auto 18px;
    }
    .picker-title {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--texte-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 11px;
      margin-bottom: 14px;
    }
    .picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    @media (max-width: 500px) {
      .picker-grid { grid-template-columns: 1fr 1fr; }
    }
    .picker-agent {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--bg2);
      border: 1px solid var(--bordure);
      border-radius: 12px;
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
    }
    .picker-agent:hover {
      border-color: var(--vert);
      background: var(--vert-glow);
    }
    .picker-agent-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .picker-agent-info { min-width: 0; }
    .picker-agent-nom {
      font-size: 13px;
      font-weight: 600;
      color: var(--texte);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .picker-agent-type {
      font-size: 11px;
      color: var(--texte-muted);
      margin-top: 1px;
    }
    .picker-agent-plan {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .plan-gratuit { background: rgba(62,207,110,0.12); color: var(--vert); }
    .plan-pro { background: rgba(139,92,246,0.15); color: #a78bfa; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg { animation: fadeIn 0.2s ease; }
  </style>
</head>
<body>

  <div class="lab-banner">⚗ Chat Lab — page de test uniquement, non liée à la production</div>

  <header class="chat-header">
    <div class="logo">Créatis<span>.</span></div>
    <div class="header-right">
      <span class="plan-badge">CHAT LAB</span>
      <button class="clear-btn" onclick="clearChat()">Effacer</button>
    </div>
  </header>

  <div class="chat-area" id="chatArea">
    <div class="messages-inner" id="messagesInner">

      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-sphere-wrap">
          <canvas id="sphereCanvas" width="120" height="120"></canvas>
        </div>
        <div>
          <p class="empty-title">Que veux-tu créer ?</p>
          <p class="empty-sub" style="margin-top:6px">Choisis un agent via le bouton <strong style="color:var(--vert)">+</strong> ou sélectionne un raccourci.</p>
        </div>
        <div class="quick-agents" id="quickAgents"></div>
      </div>

    </div>
  </div>

  <div class="chat-bottom">
    <div class="input-row">
      <button class="plus-btn" id="plusBtn" onclick="togglePicker()" title="Choisir un agent">+</button>
      <div class="chat-input-wrap">
        <textarea
          class="chat-input"
          id="chatInput"
          placeholder="Envoie un message ou clique sur + pour choisir un agent…"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" onclick="sendFreeMessage()" title="Envoyer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9z"/>
          </svg>
        </button>
      </div>
    </div>
    <p class="input-hint">+ pour choisir un agent · Entrée pour envoyer</p>
  </div>

  <!-- Agent picker -->
  <div class="picker-overlay" id="pickerOverlay">
    <div class="picker-backdrop" onclick="closePicker()"></div>
    <div class="picker-panel">
      <div class="picker-handle"></div>
      <p class="picker-title">Choisir un agent</p>
      <div class="picker-grid" id="pickerGrid"></div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/agents.js"></script>
  <script>
    /* ═══════════════════════════════════════════
       SPHERE ANIMATION
    ═══════════════════════════════════════════ */
    function animerSphere(canvas, R = 42, size = 120) {
      if (!canvas || canvas._running) return;
      canvas._running = true;
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const cx = W / 2, cy = H / 2;
      const N = 180;
      let angle = 0, alive = true;

      const pts = Array.from({ length: N }, () => {
        const u = Math.random(), v = Math.random();
        const theta = 2 * Math.PI * u;
        const phi = Math.acos(2 * v - 1);
        return {
          x: R * Math.sin(phi) * Math.cos(theta),
          y: R * Math.sin(phi) * Math.sin(theta),
          z: R * Math.cos(phi),
          r: Math.random() * 1.5 + 0.4
        };
      });

      const obs = new IntersectionObserver(e => {
        alive = e[0].isIntersecting;
        if (alive) loop();
      }, { threshold: 0 });
      obs.observe(canvas);

      const loop = () => {
        if (!alive || !canvas.isConnected) { obs.disconnect(); return; }
        ctx.clearRect(0, 0, W, H);
        angle += 0.006;
        const cosA = Math.cos(angle), sinA = Math.sin(angle);
        const cosB = Math.cos(angle * 0.35), sinB = Math.sin(angle * 0.35);
        const projected = pts.map(p => {
          const x1 = p.x * cosA + p.z * sinA;
          const z1 = -p.x * sinA + p.z * cosA;
          const y1 = p.y * cosB - z1 * sinB;
          const z2 = p.y * sinB + z1 * cosB;
          const depth = (z2 + R * 1.2) / (R * 2.4);
          return { sx: cx + x1, sy: cy + y1, depth, r: p.r * depth };
        }).sort((a, b) => a.depth - b.depth);
        projected.forEach(p => {
          const alpha = Math.max(0.06, p.depth * 0.85);
          ctx.beginPath();
          ctx.arc(p.sx, p.sy, Math.max(0.3, p.r), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(62,207,110,${alpha.toFixed(2)})`;
          ctx.fill();
        });
        const grad = ctx.createRadialGradient(cx, cy, R * 0.55, cx, cy, R * 1.05);
        grad.addColorStop(0, 'rgba(62,207,110,0)');
        grad.addColorStop(1, 'rgba(62,207,110,0.05)');
        ctx.beginPath();
        ctx.arc(cx, cy, R * 1.05, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        requestAnimationFrame(loop);
      };
      loop();
    }

    animerSphere(document.getElementById('sphereCanvas'));

    /* ═══════════════════════════════════════════
       AGENTS DATA
    ═══════════════════════════════════════════ */
    const agents = typeof AGENTS !== 'undefined' ? AGENTS : [];
    const PLAN_LABELS = { gratuit: 'Gratuit', pro: 'Pro', studio: 'Studio' };
    const AGENT_PLANS = {
      'youtube-complet': 'gratuit', 'youtube-short': 'gratuit',
      'idees-videos': 'gratuit', 'chat-libre': 'gratuit',
      'miniature-ia': 'pro', 'recyclage-contenu': 'pro',
      'reponses-commentaires': 'pro', 'prospection-sponsors': 'pro',
      'analyse-video': 'pro', 'offre-commerciale': 'pro'
    };

    /* ═══════════════════════════════════════════
       INIT PICKER + QUICK AGENTS
    ═══════════════════════════════════════════ */
    const pickerGrid = document.getElementById('pickerGrid');
    const quickAgents = document.getElementById('quickAgents');

    agents.forEach(agent => {
      const plan = AGENT_PLANS[agent.id] || 'gratuit';
      const colorHex = agent.couleur || '#3ecf6e';

      // Picker card
      const card = document.createElement('button');
      card.className = 'picker-agent';
      card.onclick = () => { closePicker(); openAgentForm(agent); };
      card.innerHTML = `
        <div class="picker-agent-icon" style="background:${colorHex}18">
          <span style="color:${colorHex};display:flex;align-items:center">${agent.icone}</span>
        </div>
        <div class="picker-agent-info">
          <div class="picker-agent-nom">${agent.nom}</div>
          <div class="picker-agent-type">${agent.type === 'miniature' ? '🖼 Image' : agent.type === 'chat' ? '💬 Chat' : '✍️ Texte'}</div>
        </div>
        <span class="picker-agent-plan plan-${plan}">${plan === 'gratuit' ? 'Free' : 'Pro'}</span>`;
      pickerGrid.appendChild(card);

      // Quick shortcut (first 5 agents)
      if (['youtube-complet','youtube-short','idees-videos','miniature-ia','recyclage-contenu'].includes(agent.id)) {
        const btn = document.createElement('button');
        btn.className = 'quick-agent-btn';
        btn.onclick = () => openAgentForm(agent);
        btn.innerHTML = `<span class="q-dot" style="background:${colorHex}"></span>${agent.nom}`;
        quickAgents.appendChild(btn);
      }
    });

    /* ═══════════════════════════════════════════
       PICKER TOGGLE
    ═══════════════════════════════════════════ */
    function togglePicker() {
      const overlay = document.getElementById('pickerOverlay');
      const btn = document.getElementById('plusBtn');
      const isOpen = overlay.classList.contains('open');
      overlay.classList.toggle('open', !isOpen);
      btn.classList.toggle('active', !isOpen);
      if (!isOpen) btn.textContent = '×';
      else btn.textContent = '+';
    }
    function closePicker() {
      document.getElementById('pickerOverlay').classList.remove('open');
      const btn = document.getElementById('plusBtn');
      btn.classList.remove('active');
      btn.textContent = '+';
    }

    /* ═══════════════════════════════════════════
       FORM CARD IN CHAT
    ═══════════════════════════════════════════ */
    let formCounter = 0;

    function openAgentForm(agent) {
      hideEmptyState();
      const id = 'form_' + (++formCounter);
      const colorHex = agent.couleur || '#3ecf6e';

      const div = document.createElement('div');
      div.className = 'msg';
      div.id = id;

      // Build inputs HTML
      const inputsHtml = (agent.inputs || []).map(inp => {
        if (inp.type === 'select') {
          const opts = (inp.options || []).map(o => `<option value="${o}">${o}</option>`).join('');
          return `<div class="form-row">
            <label>${inp.label}${inp.requis ? ' *' : ''}</label>
            <select name="${inp.id}">${opts}</select>
          </div>`;
        }
        if (inp.type === 'textarea') {
          return `<div class="form-row">
            <label>${inp.label}${inp.requis ? ' *' : ''}</label>
            <textarea name="${inp.id}" placeholder="${inp.placeholder || ''}" ${inp.requis ? 'required' : ''}></textarea>
          </div>`;
        }
        return `<div class="form-row">
          <label>${inp.label}${inp.requis ? ' *' : ''}</label>
          <input type="text" name="${inp.id}" placeholder="${inp.placeholder || ''}" ${inp.requis ? 'required' : ''}>
        </div>`;
      }).join('');

      div.innerHTML = `
        <div class="msg-form-card" style="--agent-color:${colorHex}">
          <div class="form-card-header">
            <div class="form-card-icon" style="background:${colorHex}18;color:${colorHex}">
              ${agent.icone}
            </div>
            <div class="form-card-info">
              <div class="form-card-nom">${agent.nom}</div>
              <div class="form-card-desc">${agent.description}</div>
            </div>
            <button class="form-card-close" onclick="removeMsg('${id}')" title="Fermer">×</button>
          </div>
          <form class="form-card-body" id="form_body_${id}" onsubmit="submitForm(event,'${id}')">
            ${inputsHtml}
            <div class="form-card-actions">
              <button type="submit" class="btn-generer" id="btn_${id}">
                <span class="btn-text">Générer →</span>
              </button>
            </div>
          </form>
        </div>`;

      // Store agent ref on the element
      div._agent = agent;
      document.getElementById('messagesInner').appendChild(div);
      scrollBottom();

      // Focus first text input
      setTimeout(() => {
        const firstInput = div.querySelector('input,textarea');
        if (firstInput) firstInput.focus();
      }, 50);
    }

    /* ═══════════════════════════════════════════
       FORM SUBMIT → GENERATE
    ═══════════════════════════════════════════ */
    async function submitForm(e, formId) {
      e.preventDefault();
      const formDiv = document.getElementById(formId);
      const agent = formDiv._agent;
      const form = document.getElementById(`form_body_${formId}`);
      const btn = document.getElementById(`btn_${formId}`);

      // Collect form data
      const donnees = {};
      form.querySelectorAll('[name]').forEach(el => {
        donnees[el.name] = el.value.trim();
      });

      // Validate required
      const firstInput = agent.inputs?.find(i => i.requis && !donnees[i.id]);
      if (firstInput) {
        const el = form.querySelector(`[name="${firstInput.id}"]`);
        el?.focus();
        el?.style && (el.style.borderColor = '#f87171');
        setTimeout(() => el?.style && (el.style.borderColor = ''), 1500);
        return;
      }

      // Loading state
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> Génération…`;

      // User summary message
      const summary = donnees[agent.inputs?.[0]?.id] || agent.nom;
      addUserMsg(agent.nom, summary, agent.couleur);

      // Collapse form card
      formDiv.querySelector('.msg-form-card').style.opacity = '0.4';
      formDiv.querySelector('.msg-form-card').style.pointerEvents = 'none';

      // Loading AI bubble
      const loadingId = addLoadingMsg();
      scrollBottom();

      try {
        let result;
        if (agent.type === 'miniature') {
          result = await genererImage(agent, donnees);
        } else {
          result = await genererTexte(agent, donnees);
        }
        removeMsg(loadingId);
        addAIMsg(result, agent);
        removeMsg(formId);
      } catch (err) {
        removeMsg(loadingId);
        addErrorMsg(err.message || 'Erreur lors de la génération.');
        btn.disabled = false;
        btn.innerHTML = `<span class="btn-text">Réessayer →</span>`;
        formDiv.querySelector('.msg-form-card').style.opacity = '1';
        formDiv.querySelector('.msg-form-card').style.pointerEvents = '';
      }
    }

    /* ═══════════════════════════════════════════
       API CALLS
    ═══════════════════════════════════════════ */
    async function genererTexte(agent, donnees) {
      const prompt = agent.construirePrompt(donnees, '');
      const res = await fetch('/api/groq', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [{ role: 'user', content: prompt }],
          model: 'llama-3.3-70b-versatile',
          temperature: 0.8,
          max_tokens: 4096
        })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `Erreur API (${res.status})`);
      }
      const data = await res.json();
      return data.choices?.[0]?.message?.content || data.content || '';
    }

    async function genererImage(agent, donnees) {
      const prompt = agent.construirePrompt(donnees, '');
      const isShort = (donnees.format || '').includes('9:16');
      const res = await fetch('/api/generate-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt,
          width: isShort ? 768 : 1280,
          height: isShort ? 1280 : 720
        })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `Erreur image (${res.status})`);
      }
      const data = await res.json();
      return { type: 'image', url: data.url || data.image_url || data.data?.[0]?.url };
    }

    /* ═══════════════════════════════════════════
       MESSAGE HELPERS
    ═══════════════════════════════════════════ */
    function hideEmptyState() {
      const es = document.getElementById('emptyState');
      if (es) es.style.display = 'none';
    }

    function addUserMsg(agentNom, summary, color) {
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<div class="msg-user" style="align-self:flex-end">
        <div class="msg-user-label">${agentNom}</div>
        <div>${escHtml(summary)}</div>
      </div>`;
      document.getElementById('messagesInner').appendChild(div);
      scrollBottom();
    }

    function addLoadingMsg() {
      const id = 'loading_' + Date.now();
      const div = document.createElement('div');
      div.className = 'msg'; div.id = id;
      div.innerHTML = `<div class="msg-ai">
        <div class="msg-ai-avatar">${sphereIcon()}</div>
        <div class="msg-ai-bubble loading">
          <span>Génération en cours</span>
          <span class="dots-anim"><span></span><span></span><span></span></span>
        </div>
      </div>`;
      document.getElementById('messagesInner').appendChild(div);
      scrollBottom();
      return id;
    }

    function addAIMsg(result, agent) {
      const id = 'ai_' + Date.now();
      const div = document.createElement('div');
      div.className = 'msg'; div.id = id;

      let content = '';
      if (result && result.type === 'image') {
        content = `<div class="ai-image-result">
          <img src="${result.url}" alt="Miniature générée" loading="lazy">
          <div class="msg-ai-actions">
            <a href="${result.url}" download="miniature-creatis.jpg" target="_blank" class="btn-action">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Télécharger
            </a>
          </div>
        </div>`;
      } else {
        const html = mdToHtml(typeof result === 'string' ? result : '');
        content = `<div class="ai-content">${html}</div>
          <div class="msg-ai-actions">
            <button class="btn-action" onclick="copyText('${id}')">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Copier
            </button>
          </div>`;
      }

      div.innerHTML = `<div class="msg-ai">
        <div class="msg-ai-avatar">${sphereIcon()}</div>
        <div class="msg-ai-bubble">${content}</div>
      </div>`;
      div._rawText = typeof result === 'string' ? result : '';
      document.getElementById('messagesInner').appendChild(div);
      scrollBottom();
    }

    function addErrorMsg(text) {
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<div class="msg-ai">
        <div class="msg-ai-avatar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
        <div class="msg-ai-bubble" style="border-color:rgba(248,113,113,0.2);color:#f87171">${escHtml(text)}</div>
      </div>`;
      document.getElementById('messagesInner').appendChild(div);
      scrollBottom();
    }

    function removeMsg(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function scrollBottom() {
      const area = document.getElementById('chatArea');
      setTimeout(() => area.scrollTo({ top: area.scrollHeight, behavior: 'smooth' }), 50);
    }

    function clearChat() {
      const inner = document.getElementById('messagesInner');
      inner.innerHTML = '';
      // Re-add empty state
      const es = document.createElement('div');
      es.className = 'empty-state';
      es.id = 'emptyState';
      es.innerHTML = `<div class="empty-sphere-wrap"><canvas id="sphereCanvas" width="120" height="120"></canvas></div>
        <div>
          <p class="empty-title">Que veux-tu créer ?</p>
          <p class="empty-sub" style="margin-top:6px">Choisis un agent via le bouton <strong style="color:var(--vert)">+</strong> ou sélectionne un raccourci.</p>
        </div>
        <div class="quick-agents">${quickAgents.innerHTML}</div>`;
      inner.appendChild(es);
      // Re-bind quick agents
      es.querySelectorAll('.quick-agent-btn').forEach((btn, i) => {
        const shortAgents = ['youtube-complet','youtube-short','idees-videos','miniature-ia','recyclage-contenu'];
        const agent = agents.find(a => a.id === shortAgents[i]);
        if (agent) btn.onclick = () => openAgentForm(agent);
      });
      animerSphere(document.getElementById('sphereCanvas'));
      formCounter = 0;
    }

    /* ═══════════════════════════════════════════
       FREE MESSAGE (chat-libre)
    ═══════════════════════════════════════════ */
    async function sendFreeMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      input.style.height = '';
      hideEmptyState();

      addUserMsg('Message libre', text, '#3ecf6e');
      const loadingId = addLoadingMsg();

      try {
        const res = await fetch('/api/groq', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: 'Tu es Créatis, un assistant IA expert en création de contenu YouTube pour créateurs francophones. Réponds toujours en français, de façon utile, directe et professionnelle.' },
              { role: 'user', content: text }
            ],
            model: 'llama-3.3-70b-versatile',
            temperature: 0.8,
            max_tokens: 2048
          })
        });
        if (!res.ok) throw new Error(`Erreur API (${res.status})`);
        const data = await res.json();
        const content = data.choices?.[0]?.message?.content || '';
        removeMsg(loadingId);
        addAIMsg(content, null);
      } catch (err) {
        removeMsg(loadingId);
        addErrorMsg(err.message);
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendFreeMessage();
      }
    }
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    /* ═══════════════════════════════════════════
       UTILS
    ═══════════════════════════════════════════ */
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function copyText(msgId) {
      const el = document.getElementById(msgId);
      const text = el?._rawText || el?.querySelector('.ai-content')?.innerText || '';
      navigator.clipboard.writeText(text).then(() => {
        const btn = el?.querySelector('.btn-action');
        if (btn) { const old = btn.innerHTML; btn.innerHTML = '✓ Copié'; setTimeout(() => btn.innerHTML = old, 1500); }
      }).catch(() => {});
    }

    function sphereIcon() {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>`;
    }

    function mdToHtml(text) {
      if (!text) return '';
      return text
        // Headers
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h2>$1</h2>')
        // Bold + italic
        .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        // Code
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // HR
        .replace(/^---+$/gm, '<hr>')
        // Lists (—, -, *)
        .replace(/^[—–\-\*] (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>(\n|$))+/g, m => `<ul>${m}</ul>`)
        // Numbered lists
        .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
        // Paragraphs
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br>')
        // Wrap
        .replace(/^(?!<[hupoli])(.+)$/gm, (m) => m.startsWith('<') ? m : m)
        // Clean up
        .replace(/<\/ul><br><ul>/g, '')
        .replace(/<p><\/p>/g, '');
    }

    /* Close picker on Escape */
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });
  </script>
</body>
</html>
