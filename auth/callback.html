<body>
  <div class="cb-box">
    <div class="cb-logo">Créatis<span>.</span></div>
    <div class="cb-spinner"></div>
    <div class="cb-titre">Connexion en cours…</div>
    <div class="cb-erreur" id="cb-erreur"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (async () => {
      // Vérifier si Supabase/Google a retourné une erreur dans l'URL
      const urlParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace('#', ''));
      const urlError = urlParams.get('error') || hashParams.get('error');
      if (urlError) {
        const desc = urlParams.get('error_description') || hashParams.get('error_description') || urlError;
        const el = document.getElementById('cb-erreur');
        el.textContent = 'Erreur de connexion — Réessaie avec Google ou email/mot de passe.';
        el.style.display = 'block';
        document.querySelector('.cb-spinner').style.display = 'none';
        document.querySelector('.cb-titre').textContent = '';
        setTimeout(() => { window.location.href = '/auth.html?error=oauth_failed'; }, 2500);
        return;
      }

      const timeoutId = setTimeout(() => {
        const el = document.getElementById('cb-erreur');
        el.textContent = 'La connexion prend trop de temps — Réessaie.';
        el.style.display = 'block';
        document.querySelector('.cb-spinner').style.display = 'none';
        setTimeout(() => { window.location.href = '/auth.html?error=timeout'; }, 2000);
      }, 15000);

      try {
        const user = await Auth.handleOAuthCallback();
        clearTimeout(timeoutId);

        // Sync user data to localStorage so app.html has it immediately
        const nom = user.user_metadata?.full_name || user.user_metadata?.name || user.email.split('@')[0];
        const avatar = user.user_metadata?.avatar_url || null;
        localStorage.setItem('creatis_user', JSON.stringify({
          id: user.id,
          email: user.email,
          nom,
          avatar,
          plan: 'gratuit'
        }));

        // Meta Pixel + CAPI — uniquement pour les nouveaux inscrits (created_at < 60s)
        const isNewUser = user.created_at && (Date.now() - new Date(user.created_at).getTime()) < 60000;
        if (isNewUser) {
          const capiEventId = 'reg_oauth_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
          if (typeof fbq !== 'undefined') {
            fbq('track', 'CompleteRegistration', {}, { eventID: capiEventId });
          }
          fetch('/api/user-sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'track_event', email: user.email, eventId: capiEventId, eventSourceUrl: 'https://creatis.app/auth/callback' })
          }).catch(() => {});
        }

        // Vérifier si un plan cible est en attente (flow paiement post-auth)
        const planCible = localStorage.getItem('creatis_plan_cible');
        if (planCible && window.CONFIG?.PLANS?.[planCible]) {
          // Laisser integrations.js gérer la redirection vers Stripe
          window.location.href = '/app.html';
          return;
        }

        const returnUrl = new URLSearchParams(window.location.search).get('returnUrl');
        window.location.href = returnUrl || '/app.html';
      } catch (err) {
        clearTimeout(timeoutId);
        // Avant de renvoyer vers auth.html, vérifier si une session existe déjà
        try {
          const client = window.supabase?.createClient?.(window.CONFIG?.SUPABASE_URL, window.CONFIG?.SUPABASE_ANON_KEY);
          if (client) {
            const { data } = await client.auth.getSession();
            if (data?.session) {
              window.location.href = '/app.html';
              return;
            }
          }
        } catch (_) {}
        const el = document.getElementById('cb-erreur');
        el.textContent = 'Erreur de connexion : ' + err.message + ' — Redirection…';
        el.style.display = 'block';
        document.querySelector('.cb-spinner').style.display = 'none';
        setTimeout(() => { window.location.href = '/auth.html'; }, 2000);
      }
    })();
  </script>
